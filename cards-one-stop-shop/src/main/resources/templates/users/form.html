<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${isNew} ? 'Add User' : 'Edit User'">User Form</title>
    <style>
        /* — User Form: matching indigo security theme — */
        @keyframes formUp {
            from { opacity: 0; transform: translateY(22px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes breadcrumbFade {
            from { opacity: 0; } to { opacity: 1; }
        }

        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            background: linear-gradient(160deg, #ede8f8 0%, #f0f0f8 60%, #e8eaf6 100%);
            min-height: 100vh;
            padding: 1rem 1.5rem;
        }

        h2 { color: #3d0066; margin-bottom: 1.2rem; animation: formUp 0.4s ease both; }
        
        .breadcrumb { font-size: 0.84rem; margin-bottom: 0.8rem; animation: breadcrumbFade 0.5s ease 0.05s both; opacity: 0; }
        .breadcrumb a { color: #5c35a0; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        
        .form-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(61,0,102,0.1);
            padding: 1.5rem 2rem;
            max-width: 720px;
            animation: formUp 0.45s ease 0.1s both;
            opacity: 0;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.85rem; font-weight: 600; margin-bottom: 3px; color: #3d0066; }
        
        input, select {
            padding: 7px 9px; border: 1px solid #b3a0d4; border-radius: 6px;
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none; border-color: #5c35a0;
            box-shadow: 0 0 3px rgba(92,53,160,0.15);
        }

        .note { font-size: 0.75rem; color: #888; margin-top: 3px; }
        
        .btn {
            padding: 8px 22px; border-radius: 6px; border: none;
            cursor: pointer; font-size: 0.9rem; font-weight: 600;
            margin-top: 1.2rem; margin-right: 0.5rem;
            text-decoration: none; display: inline-block;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, #3d0066, #5c35a0); color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        
        .alert { padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.88rem; max-width: 720px; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .full-width { grid-column: 1 / -1; }
    </style>
</head>
<body>

<div class="breadcrumb">
    <a th:href="@{/home}">&#8962; Home</a>
    &nbsp;/&nbsp;
    <a th:href="@{/users}">User Authorization</a>
    &nbsp;/&nbsp;
    <span th:text="${isNew} ? 'Add User' : 'Edit User'">Form</span>
</div>

<h2 th:text="${isNew} ? 'Add New User' : 'Edit User'">User Form</h2>

<!-- Flash error (e.g. duplicate username) -->
<div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

<div class="form-card">
<form th:action="@{/users/save}" method="post" th:object="${user}">

    <input type="hidden" name="isNew" th:value="${isNew}"/>
    <input type="hidden" th:if="${!isNew}" th:field="*{userId}"/>

    <div class="form-grid">

        <div class="form-group">
            <label>User ID *</label>
            <input type="number" th:field="*{userId}"
                   th:readonly="${!isNew}"
                   th:style="${!isNew} ? 'background:#f5f5f5;' : ''"
                   required/>
            <span th:if="${!isNew}" class="note">ID cannot be changed after creation.</span>
        </div>

        <div class="form-group">
            <label>Username *</label>
            <input type="text" th:field="*{userName}"
                   th:readonly="${!isNew}"
                   th:style="${!isNew} ? 'background:#f5f5f5;' : ''"
                   required/>
            <span th:if="${!isNew}" class="note">Username cannot be changed.</span>
        </div>

        <div class="form-group">
            <label th:text="${isNew} ? 'Password *' : 'New Password'">Password</label>
            <input type="password" name="rawPassword"
                   th:placeholder="${isNew} ? 'Enter password' : 'Leave blank to keep current'"/>
            <span th:if="${!isNew}" class="note">Leave blank to keep the existing password.</span>
        </div>

        <div class="form-group">
            <label>Role *</label>
            <select th:field="*{userRole}" required>
                <option value="">-- Select Role --</option>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
            </select>
        </div>

    </div>

    <div>
        <button class="btn btn-primary" type="submit"
                th:text="${isNew} ? 'Add User' : 'Save Changes'">Submit</button>
        <a class="btn btn-secondary" th:href="@{/users}">Cancel</a>
    </div>

</form>
</div></body>
</html>
