<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${project.projectId != null ? 'Edit Project' : 'Add Project'}">Project Form</title>
    <style>
        /* — Project Form: emerald/green data-entry theme — */
        @keyframes formSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes breadcrumbFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background: linear-gradient(160deg, #e8f5e9 0%, #f0f7f4 60%, #e3f2fd 100%);
            min-height: 100vh;
            padding: 1rem 1.5rem;
        }

        h2 { color: #1b5e20; animation: formSlideUp 0.4s ease both; }
        
        p.breadcrumb-line { animation: breadcrumbFade 0.5s ease 0.1s both; opacity: 0; }
        p.breadcrumb-line a { color: #2e7d32; font-size: 0.85rem; text-decoration: none; }
        p.breadcrumb-line a:hover { text-decoration: underline; }
        
        .form-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 1.5rem 2rem;
            max-width: 940px;
            animation: formSlideUp 0.45s ease 0.1s both;
            opacity: 0;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.85rem; font-weight: 600; margin-bottom: 3px; color: #1b5e20; }
        
        input, select {
            padding: 7px 8px; border: 1px solid #a5d6a7; border-radius: 6px;
            font-size: 0.88rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none; border-color: #2e7d32;
            box-shadow: 0 0 3px rgba(46,125,50,0.15);
        }

        .btn {
            padding: 8px 22px; border-radius: 6px; border: none;
            cursor: pointer; margin-top: 1.2rem; margin-right: 0.5rem;
            font-size: 0.9rem; font-weight: 600;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, #2e7d32, #43a047); color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        
        .note { font-size: 0.75rem; color: #888; }
        .full-width { grid-column: 1 / -1; }
        .date-input-group { display: flex; align-items: center; gap: 0.5rem; }
        .tbd-label { font-size: 0.85rem; font-weight: normal; display: flex; align-items: center; gap: 3px; white-space: nowrap; color: #555; }
    </style>
</head>
<body>

<h2 th:text="${project.projectId != null} ? 'Edit Project' : 'Add New Project'">Project Form</h2>
<p class="breadcrumb-line" style="margin-bottom:1rem;">
    <a th:href="@{/home}">&#8962; Home</a>
    &nbsp;/&nbsp;
    <a th:href="@{/projects}">Project List</a>
</p>

<div class="form-card">
    <form th:action="@{/projects/save}" method="post" th:object="${project}">
        <input type="hidden" th:if="${project.projectId != null}" th:field="*{projectId}"/>
        
        <div class="form-grid">
            
            <div class="form-group" th:if="${project.projectId == null}">
                <label>Project ID *</label>
                <input type="text" th:field="*{projectId}" required/>
            </div>
            
            <div class="form-group">
                <label>Project Description *</label>
                <input type="text" th:field="*{projectDescription}" required/>
            </div>

            <div class="form-group">
                <label>Client ID *</label>
                <input type="text" th:field="*{clientId}" required/>
            </div>

            <div class="form-group">
                <label>Platform *</label>
                <select th:field="*{platform}" required>
                    <option value="">-- Select --</option>
                    <option th:each="p : ${platforms}" th:value="${p}" th:text="${p}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Release Date <span class="note">(DD-MON-YYYY or TBD)</span></label>
                <input type="text" th:field="*{releaseDate}" placeholder="e.g. 15-JAN-2025 or TBD"/>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select th:field="*{status}">
                    <option value="">-- Select --</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" th:field="*{catagory}"/>
            </div>

            <div class="form-group">
                <label>Estimate</label>
                <input type="text" th:field="*{estimate}"/>
            </div>

            <div class="form-group">
                <label>Sol. Walk Through Date</label>
                <div class="date-input-group">
                    <input type="date" id="solWalkThroughDt_picker" onchange="syncDate(this, 'solWalkThroughDt')"/>
                    <input type="hidden" th:field="*{solWalkThroughDt}"/>
                    <label class="tbd-label">
                        <input type="checkbox" id="solWalkThroughDt_tbd" onchange="toggleTbd(this, 'solWalkThroughDt')"/> TBD
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Design Walk Through Date</label>
                <div class="date-input-group">
                    <input type="date" id="designWalkThroughDt_picker" onchange="syncDate(this, 'designWalkThroughDt')"/>
                    <input type="hidden" th:field="*{designWalkThroughDt}"/>
                    <label class="tbd-label">
                        <input type="checkbox" id="designWalkThroughDt_tbd" onchange="toggleTbd(this, 'designWalkThroughDt')"/> TBD
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Tech Review Date</label>
                <div class="date-input-group">
                    <input type="date" id="techReviewDt_picker" onchange="syncDate(this, 'techReviewDt')"/>
                    <input type="hidden" th:field="*{techReviewDt}"/>
                    <label class="tbd-label">
                        <input type="checkbox" id="techReviewDt_tbd" onchange="toggleTbd(this, 'techReviewDt')"/> TBD
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Q-Migration Date</label>
                <div class="date-input-group">
                    <input type="date" id="qMigrationDt_picker" onchange="syncDate(this, 'qMigrationDt')"/>
                    <input type="hidden" th:field="*{qMigrationDt}"/>
                    <label class="tbd-label">
                        <input type="checkbox" id="qMigrationDt_tbd" onchange="toggleTbd(this, 'qMigrationDt')"/> TBD
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>V-Migration Date</label>
                <div class="date-input-group">
                    <input type="date" id="vMigrationDt_picker" onchange="syncDate(this, 'vMigrationDt')"/>
                    <input type="hidden" th:field="*{vMigrationDt}"/>
                    <label class="tbd-label">
                        <input type="checkbox" id="vMigrationDt_tbd" onchange="toggleTbd(this, 'vMigrationDt')"/> TBD
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Client Test Ver. Date</label>
                <div class="date-input-group">
                    <input type="date" id="clientTestVerDt_picker" onchange="syncDate(this, 'clientTestVerDt')"/>
                    <input type="hidden" th:field="*{clientTestVerDt}"/>
                    <label class="tbd-label">
                        <input type="checkbox" id="clientTestVerDt_tbd" onchange="toggleTbd(this, 'clientTestVerDt')"/> TBD
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>P-Migration Date</label>
                <div class="date-input-group">
                    <input type="date" id="pMigrationDt_picker" onchange="syncDate(this, 'pMigrationDt')"/>
                    <input type="hidden" th:field="*{pMigrationDt}"/>
                    <label class="tbd-label">
                        <input type="checkbox" id="pMigrationDt_tbd" onchange="toggleTbd(this, 'pMigrationDt')"/> TBD
                    </label>
                </div>
            </div>

            <div class="form-group" th:if="${isAdmin}">
                <label>Assigned To * (Admin)</label>
                <select th:field="*{assignedTo}" required>
                    <option value="">-- Select User --</option>
                    <option th:each="u : ${users}" th:value="${u.userName}" th:text="${u.userName}"></option>
                </select>
            </div>

            <div class="form-group" th:if="${!isAdmin}">
                <label>Assigned To</label>
                <input type="text" th:value="${currentUserName}" readonly/>
            </div>

        </div>

        <div>
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-secondary" th:href="@{/projects}">Cancel</a>
        </div>
    </form>
</div>

<script>
function syncDate(picker, fieldId) {
    document.getElementById(fieldId).value = picker.value;
}

function toggleTbd(cb, fieldId) {
    const picker = document.getElementById(fieldId + '_picker');
    const hidden = document.getElementById(fieldId);
    if (cb.checked) {
        picker.disabled = true;
        picker.value = '';
        hidden.value = 'TBD';
    } else {
        picker.disabled = false;
        hidden.value = picker.value;
    }
}

document.addEventListener('DOMContentLoaded', function () {
    ['solWalkThroughDt', 'designWalkThroughDt', 'techReviewDt', 'qMigrationDt', 'vMigrationDt', 'clientTestVerDt', 'pMigrationDt'].forEach(function(fieldId) {
        const hidden = document.getElementById(fieldId);
        const tbd = document.getElementById(fieldId + '_tbd');
        const picker = document.getElementById(fieldId + '_picker');
        
        if (!hidden || !tbd || !picker) return;
        
        if (hidden.value === 'TBD') {
            tbd.checked = true;
            picker.disabled = true;
        } else {
            picker.value = hidden.value || '';
        }
    });
});
</script>
</body>
</html>
